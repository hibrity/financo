<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Financo - Gráfico</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: Arial, sans-serif; }
        body { max-width: 900px; margin: 1rem auto; padding: 0 0.75rem; background: #f5f5f5; }

        .cabecalho-pagina { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem; flex-wrap: wrap; gap: 1rem; }
        .titulo-pagina { font-size: 1.5rem; color: #1565c0; }
        .btn { padding: 0.75rem 1rem; border: none; border-radius: 0.5rem; font-size: 0.9rem; font-weight: 500; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 0.25rem; }
        .btn.voltar { background: #616161; color: white; }
        .btn.voltar:hover { background: #424242; }

        .caixa-grafico { background: white; padding: 1.5rem; border-radius: 0.5rem; box-shadow: 0 0.125rem 0.5rem rgba(0,0,0,0.1); margin-bottom: 1.5rem; }
        .area-grafico { position: relative; height: 320px; width: 100%; }

        .resumo { margin-top: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
        .item-barra { display: flex; align-items: center; gap: 0.75rem; }
        .rotulo { width: 140px; font-weight: 600; font-size: 0.95rem; }
        .fundo-barra { flex: 1; height: 28px; background: #e0e0e0; border-radius: 14px; overflow: hidden; position: relative; }
        .barra { height: 100%; border-radius: 14px; transition: width 0.6s ease; display: flex; align-items: center; padding-left: 0.75rem; color: white; font-weight: bold; font-size: 0.85rem; }
        .barra.vendas { background: linear-gradient(90deg, #2e7d32, #4caf50); }
        .barra.despesas { background: linear-gradient(90deg, #c62828, #ef5350); }
        .barra.saldo.positivo { background: linear-gradient(90deg, #1565c0, #42a5f5); }
        .barra.saldo.negativo { background: linear-gradient(90deg, #f57c00, #ffb74d); }
        .valor-texto { position: absolute; right: 10px; top: 50%; transform: translateY(-50%); font-weight: bold; font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="cabecalho-pagina">
        <a href="index.html" class="btn voltar">⬅️ Voltar</a>
        <h2 class="titulo-pagina">📊 Acompanhamento de Valores</h2>
        <div></div>
    </div>

    <div class="caixa-grafico">
        <!-- Barras estilo carregamento -->
        <div class="resumo">
            <div class="item-barra">
                <span class="rotulo">Total Vendas</span>
                <div class="fundo-barra">
                    <div class="barra vendas" id="barraVendas" style="width: 0%">R$ 0,00</div>
                </div>
                <span class="valor-texto" id="txtVendas">R$ 0,00</span>
            </div>

            <div class="item-barra">
                <span class="rotulo">Total Despesas</span>
                <div class="fundo-barra">
                    <div class="barra despesas" id="barraDespesas" style="width: 0%">R$ 0,00</div>
                </div>
                <span class="valor-texto" id="txtDespesas">R$ 0,00</span>
            </div>

            <div class="item-barra">
                <span class="rotulo">Saldo Líquido</span>
                <div class="fundo-barra">
                    <div class="barra saldo" id="barraSaldo" style="width: 0%">R$ 0,00</div>
                </div>
                <span class="valor-texto" id="txtSaldo">R$ 0,00</span>
            </div>
        </div>
    </div>

<script>
    function pegarTotais() {
        let v = 0, d = 0;
        const lancamentos = JSON.parse(localStorage.getItem('lancamentos_financo') || '[]');
        const contas = JSON.parse(localStorage.getItem('contas_some_ao_pagar') || '[]');

        lancamentos.forEach(l => l.tipo === 'venda' ? v += l.valor : d += l.valor);

        const hoje = new Date(new Date().toDateString());
        contas.forEach(c => {
            if (!c.paga) {
                const venc = new Date(c.vencimento + 'T00:00:00');
                const diff = Math.ceil((venc - hoje) / (1000 * 60 * 60 * 24));
                if (diff < 0 || diff === 0 || diff === 1) {
                    d += Number(c.valor) || 0;
                }
            }
        });

        return { vendas: v, despesas: d, saldo: v - d };
    }

    function atualizarBarras() {
        const dados = pegarTotais();
        const maximo = Math.max(dados.vendas, dados.despesas, Math.abs(dados.saldo), 1);

        // Vendas
        const porcVendas = (dados.vendas / maximo) * 100;
        document.getElementById('barraVendas').style.width = porcVendas + '%';
        document.getElementById('txtVendas').textContent = `R$ ${dados.vendas.toFixed(2).replace('.', ',')}`;

        // Despesas
        const porcDespesas = (dados.despesas / maximo) * 100;
        document.getElementById('barraDespesas').style.width = porcDespesas + '%';
        document.getElementById('txtDespesas').textContent = `R$ ${dados.despesas.toFixed(2).replace('.', ',')}`;

        // Saldo
        const elBarraSaldo = document.getElementById('barraSaldo');
        elBarraSaldo.classList.remove('positivo', 'negativo');
        if (dados.saldo >= 0) elBarraSaldo.classList.add('positivo');
        else elBarraSaldo.classList.add('negativo');

        const porcSaldo = (Math.abs(dados.saldo) / maximo) * 100;
        elBarraSaldo.style.width = porcSaldo + '%';
        document.getElementById('txtSaldo').textContent = `R$ ${dados.saldo.toFixed(2).replace('.', ',')}`;
    }

    window.addEventListener('storage', atualizarBarras);
    atualizarBarras();
</script>

</body>
</html>
